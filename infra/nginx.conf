# SeedInfer.com — nginx.conf — alternatywa dla Caddy na Orange Pi 4 Pro
# Użycie: zamień serwis 'caddy' w docker-compose.yml na 'nginx' lub zainstaluj nginx bare-metal
# Cache: /api/stats 60s (proxy_cache). Reszta bez cache, gzip, security headers.

# Cache strefa dla /api/stats — 10MB (~80k kluczy), 60s valid
proxy_cache_path /var/cache/nginx/api_stats levels=1:2 keys_zone=api_cache:10m inactive=70s use_temp_path=off max_size=100m;
# Alternatywnie w Dockerze: /var/cache/nginx -> volume

upstream seedinfer_app {
    server app:3000;          # Docker: nazwa serwisu
    # server 127.0.0.1:3000;   # bare-metal / host network — odkomentuj i zakomentuj linię wyżej
    keepalive 32;
}

server {
    listen 80;
    server_name seedinfer.com www.seedinfer.com;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Health
    location = /health { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
    location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

    # /api/stats — cache 60s
    location /api/stats {
        proxy_cache api_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_valid 404 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=60, s-maxage=60, stale-while-revalidate=30" always;
        add_header CDN-Cache-Control "public, max-age=60" always;

        proxy_pass http://seedinfer_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # Next.js _next/static — immutable cache 1y
    location /_next/static/ {
        proxy_pass http://seedinfer_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Reszta — no cache, proxy do Next
    location / {
        proxy_pass http://seedinfer_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 30s;

        # nie cache'uj HTML (SSR)
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}

# Fallback dla LAN / IP bez hosta
server {
    listen 80 default_server;
    server_name _;
    location / {
        proxy_pass http://seedinfer_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
